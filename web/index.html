<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/new/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GMWF">
  <meta name="apple-mobile-web-app-title" content="GMWF">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>gmwf</title>
  <link rel="manifest" href="manifest.json">
  
  
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <style id="splash-screen-style">
    html {
      height: 100%;
      background-color: #F1F8E9;
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #F1F8E9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
    }

    #splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #F1F8E9;
      z-index: 9999;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .pulsate-logo {
      max-width: 240px;
      width: 40vw;
      height: auto;
      object-fit: contain;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3.5px solid #E8F5E9;
      border-top: 3.5px solid #1B5E20;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-top: 40px;
    }

    .message {
      margin-top: 24px;
      font-size: 18px;
      font-weight: 600;
      color: #1B5E20;
      letter-spacing: 0.5px;
      text-align: center;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      const splash = document.getElementById("splash");
      if (splash) {
        splash.style.opacity = "0";
        splash.style.transition = "opacity 0.5s ease";
        setTimeout(() => {
          splash.remove();
        }, 500);
      }
    }
  </script>
</head>

<body>
  <div id="splash">
    <div class="splash-container">
      <img src="assets/logo/gmwf.png" class="pulsate-logo" alt="GMWF Logo" onerror="this.src='splash/img/light-1x.png'">
      <div class="spinner"></div>
      <div class="message">GMWF is starting...</div>
    </div>
  </div>
  
  <!-- Flutter bootstrap -->
  <title>gmwf</title>
  <link rel="manifest" href="manifest.json">


  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
